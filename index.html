<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V6 评分看板（按日期）</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0f1116; color: #e6e6e6; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
    .card { border: 1px solid #2a2f3a; background: #151923; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button, a.btn { background: #222838; color: #cfd6ea; border: 1px solid #333b52; border-radius: 6px; padding: 6px 10px; text-decoration: none; }
    iframe { width: 100%; height: calc(100vh - 120px); border: 1px solid #2d3447; background: #0f1116; border-radius: 8px; }
    .hint { color: #93a0bf; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div><b>V6 评分看板（GitHub Pages）</b></div>
      <div class="hint">生成时间: 2026-04-26 16:36:53</div>
      <div class="row" style="margin-top:8px;">
        <label for="dateSelect">选择日期:</label>
        <select id="dateSelect">
<option value="20260426">20260426</option>
<option value="20260425">20260425</option>
<option value="20260424">20260424</option>
<option value="20260423">20260423</option>
        </select>
        <button id="openBtn">加载看板</button>
      </div>
    </div>

    <iframe id="boardFrame" title="V6 Dashboard"></iframe>
  </div>

  <script>
    const sel = document.getElementById("dateSelect");
    const frame = document.getElementById("boardFrame");
    const openBtn = document.getElementById("openBtn");

    function refresh() {
      const d = sel.value;
      frame.src = `dashboards/v6_dashboard_${d}.html`;
      history.replaceState(null, "", `?date=${d}`);
    }

    openBtn.onclick = refresh;
    sel.onchange = refresh;

    const q = new URLSearchParams(location.search);
    const qsDate = q.get("date");
    if (qsDate) {
      const has = Array.from(sel.options).some(o => o.value === qsDate);
      if (has) sel.value = qsDate;
    }
    refresh();
  </script>
</body>
</html>
