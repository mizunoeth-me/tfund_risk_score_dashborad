<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>币种充提总览 · 标准链矩阵</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#11161c;color:#e3e7ec;font:12px system-ui,sans-serif}h1{font-size:18px;margin:0 0 10px}h2{font-size:16px;margin:0}a{color:#d8a25e}button,input,select{font:inherit;color:inherit;background:#1c222a;border:1px solid #343b45;padding:8px}button,summary{cursor:pointer}button:disabled{opacity:.4;cursor:default}.muted,small{color:#9aa5b1;line-height:1.7}small{display:block;margin-top:5px;font-size:11px}.filters,.heading,.pager{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}.heading{justify-content:space-between;margin:0 0 12px}.coin{border:1px solid #2a3039;background:#15191f;padding:16px;margin:16px 0}.scroll{overflow:auto;max-height:620px;border:1px solid #2a3039}table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}th,td{text-align:left;padding:10px;border-right:1px solid #2a3039;border-bottom:1px solid #2a3039;vertical-align:top;min-width:125px}thead th{position:sticky;top:0;background:#1c222a;z-index:2}th:first-child{position:sticky;left:0;min-width:155px;background:#181d23;z-index:1}thead th:first-child{z-index:3}td.version{min-width:180px;max-width:260px;overflow-wrap:anywhere}td.supply{min-width:160px}details{margin:8px 0;line-height:1.7}details p{margin:6px 0;overflow-wrap:anywhere}.open{color:#73c99c}.closed{color:#e97680}.unknown{color:#d5aa62}.flag{display:block;margin:4px 0;font-weight:600}.warning{border-left:2px solid #d5aa62;padding:10px;background:#1c222a;margin:10px 0}#search{min-width:230px}.evidence{max-width:340px;min-width:120px;font-weight:400}.tag{margin-right:14px}.empty{padding:20px}.pager{justify-content:center}@media(max-width:600px){body{padding:12px}.coin{padding:10px}#search{min-width:0;width:100%}.filters>*{max-width:100%}th:first-child{min-width:115px}td.version{min-width:155px}}
</style>
<h1>币种充提总览 · 标准链矩阵</h1>
<p class="muted">范围：当前评分币种及已接入的现货交易所。每个币种一张表，每条标准链一行；充值、提现分别显示。未列出不等于不支持，未知不等于正常。</p>
<nav><a href="./">返回打分看板</a> · <a href="data/multichain_anomalies.html">多链异常清单</a> · <a href="data/multichain_summary.csv">下载异常汇总</a></nav>
<div id="health" class="muted" role="status">正在读取统一币种数据…</div>
<div class="filters"><input id="search" aria-label="搜索币种" placeholder="搜索币种或项目名称"><select id="exchange" aria-label="筛选交易所"><option value="">全部现货交易所</option></select><input id="chain" aria-label="搜索标准链" placeholder="搜索标准链"><select id="scope" aria-label="筛选币种范围"><option value="">全部评分币种</option><option value="multi">仅多链币种</option><option value="anomaly">有异常或待核实</option></select><button id="reset">重置</button><button id="refresh">刷新数据</button></div>
<p id="count" class="muted"></p><main id="cards"></main><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={binance:'Binance',okx:'OKX',gate:'Gate',bitget:'Bitget',kucoin:'KuCoin',bybit:'Bybit',mexc:'MEXC',hyperliquid:'Hyperliquid'};
const types={native_coin:'原生币',native_issuance:'项目原生发行',native_gas:'Gas 资产（发行性质待核实）',bridged:'桥接',wrapped:'包装',migrated:'迁移旧版',unclassified:'发行性质待核实'};
const time=t=>t?new Date(t).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'未提供';
const link=(url,label)=>/^https:\/\//.test(url||'')?`<a href="${esc(url)}" target="_blank" rel="noreferrer">${esc(label)}</a>`:'';
let bundle=null,page=0,failed=false;const size=8;
$('search').value=new URLSearchParams(location.search).get('coin')||'';
function expired(t){return !Number.isFinite(Date.parse(t))||Date.now()-Date.parse(t)>bundle.stale_after_hours*3600000}
function stale(){return failed||expired(bundle.transfer_run.started_at)||expired(bundle.spot_observed_at)}
function flag(label,value,old){return `<span class="flag ${old||value==null?'unknown':value?'open':'closed'}">${label}：${old?'过期／待更新':value==null?'未知':value?'开放':'关闭'}</span>`}
function cell(c){
 if(!c)return '<span class="unknown">未取得状态</span>';
 const old=stale()||(c.routes||[]).some(r=>expired(r.observed_at));
 const state=c.status==='not_listed'?'<span class="muted">未列出该链</span>':c.status==='not_applicable'?'—':flag('充',c.deposit,old)+flag('提',c.withdraw,old);
 const evidence=(c.routes||[]).map(r=>`<p><b>${esc(r.exchange_coin)} · ${esc(r.raw_network)}</b><br>合约：${esc(r.contract==='native'?'原生币':r.contract||'未提供')}<br>${esc(r.identity)}<br>${esc(r.source_label)} · ${esc(time(r.observed_at))}（北京）<br>${flag('充',r.deposit,old)}${flag('提',r.withdraw,old)}${link(r.source_url,'查看来源')}</p>`).join('');
 return state+(c.contract_verified===false&&c.routes?.length?'<small class="unknown">合约未核实</small>':'')+(c.status==='conflict'?'<small class="unknown">版本／路径状态不一致</small>':'')+`<details class="evidence"><summary>充提依据</summary><p>${esc(c.note||'来源返回的链级开关')}</p>${evidence}</details>`;
}
function version(row){
 const reps=row.representations||[];
 const labels=[...new Set(reps.map(r=>types[r.type]||r.type))];
 return esc(labels.join(' / ')||'发行性质待核实')+`<details><summary>展开合约／版本</summary>${(row.contracts||[]).map(c=>`<p>${esc(c.address==='native'?'原生币':c.address)}<small>${esc(c.asset_names?.join(' / '))}</small></p>`).join('')||'<p>合约信息未提供</p>'}${reps.map(v=>`<p>${esc(types[v.type]||v.type)} · ${link(v.evidence?.source,'类型依据')}</p>`).join('')}<p>${esc(row.identity_note)}</p></details>`;
}
function supply(s){
 const verified=s.status==='verified'&&s.amount!==null&&s.methodology_version;
 return (verified?`<b>${esc(s.amount)} ${esc(s.unit)}</b>`:'<span class="unknown">未知</span><small>待接入，口径待确认</small>')+`<details><summary>数量与扣除依据</summary><p>${esc(s.note)}</p><p>口径：${esc(s.methodology_version||'尚未确认')}<br>数量时间：${esc(time(s.observed_at))}<br>区块：${esc(s.block_number||'未提供')}</p>${(s.exclusions||[]).map(x=>`<p>${esc(x.category)}：${esc(x.amount)} · ${esc(x.address||'')}${link(x.evidence_url,'扣除依据')}</p>`).join('')}${(s.evidence||[]).map(x=>link(x.url,x.source)).join(' · ')}</details>`;
}
function render(){
 if(!bundle)return;
 const query=$('search').value.trim().toUpperCase(),chain=$('chain').value.trim().toLowerCase(),ex=$('exchange').value,scope=$('scope').value;
 const coins=Object.values(bundle.coins).filter(c=>(!query||c.symbol.includes(query)||(c.chain_rows||[]).some(r=>r.asset_names.join(' ').toUpperCase().includes(query)))&&(!ex||c.exchanges.some(e=>e.exchange===ex))&&(!chain||(c.chain_rows||[]).some(r=>(r.chain_label+' '+r.chain_id).toLowerCase().includes(chain)))&&(!scope||(scope==='multi'?c.summary.chains>=2:c.anomalies?.length)));
 coins.sort((a,b)=>(b.symbol===query?1:0)-(a.symbol===query?1:0)||a.symbol.localeCompare(b.symbol));
 const pages=Math.max(1,Math.ceil(coins.length/size));page=Math.min(page,pages-1);
 $('health').innerHTML=`评分批次：${esc(bundle.scoring_batch)} · 充提采集：${esc(time(bundle.transfer_run.finished_at))}（北京） · 现货目录：${esc(time(bundle.spot_observed_at))}<br>发行链目录：${esc(bundle.chain_directory?.source)} · ${esc(time(bundle.chain_directory?.observed_at))}（北京）${stale()?'<div class="warning">'+(failed?'刷新失败，保留快照仅供参考。':'快照已过期，不能作为当前充提结论。')+'</div>':''}`;
 $('count').textContent=`匹配 ${coins.length} 个币种；每页 ${size} 个。交易所筛选保留该币全部交易所列，便于横向对照。`;
 $('cards').innerHTML=coins.slice(page*size,(page+1)*size).map(c=>{
  const rows=(c.chain_rows||[]).filter(r=>!chain||(r.chain_label+' '+r.chain_id).toLowerCase().includes(chain));
  const head=c.exchanges.map(e=>`<th>${esc(names[e.exchange]||e.exchange)}<small>${e.pairs.length} 个现货对${['bybit','mexc'].includes(e.exchange)?' · 充提第三方':''}</small></th>`).join('');
  const table=rows.length?`<div class="scroll" tabindex="0" aria-label="${esc(c.symbol)} 充提矩阵"><table><thead><tr><th>标准链</th><th>发行类型／版本</th><th>该链流通量</th>${head}</tr></thead><tbody>${rows.map(r=>`<tr><th scope="row">${esc(r.chain_label)}${r.chain_kind==='transfer_network'?'<small>转账网络，不计发行链</small>':''}</th><td class="version">${version(r)}</td><td class="supply">${supply(r.supply)}</td>${c.exchanges.map(e=>`<td>${cell(r.cells[e.exchange])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="muted">尚无已确认的标准链记录。请查看覆盖缺口与待核实网络。</p>';
  return `<section class="coin" data-coin="${esc(c.symbol)}"><div class="heading"><h2>${esc(c.symbol)}</h2><span class="muted">${c.summary.chains} 条标准链 · ${c.exchanges.length} 家现货所 · 币种身份：${['matched','reviewed'].includes(c.identity_status)?'已匹配':'待核实'}</span></div>${!c.exchanges.length?'<p class="warning">已接入目录中未确认现货交易所，不代表全球不支持。</p>':''}${table}<details><summary>交易所覆盖与数据缺口</summary>${Object.entries(c.coverage||{}).map(([e,v])=>`<p>${esc(names[e]||e)}：${v.status==='observed'?'已取得路径':v.status==='partial'?'部分覆盖':'缺失'} · ${esc(v.reason)} · ${esc(time(v.observed_at))}</p>`).join('')||'<p>无已确认现货交易所</p>'}</details>${c.pending_networks?.length?`<details><summary>待核实网络（${c.pending_networks.length} 项，不计入标准链）</summary>${c.pending_networks.map(r=>`<p><b>${esc(r.chain_label)}</b></p>${c.exchanges.filter(e=>r.cells[e.exchange]?.routes.length).map(e=>`<div>${esc(names[e.exchange]||e.exchange)}${cell(r.cells[e.exchange])}</div>`).join('')}`).join('')}</details>`:''}${c.anomalies?.length?`<details><summary>异常与待核实（${c.anomalies.length} 项）</summary>${c.anomalies.map(a=>`<p><b>${esc(a.label)}</b> · ${esc(a.detail)}</p>`).join('')}</details>`:''}</section>`;
 }).join('')||'<p class="empty">没有匹配的评分币种。</p>';
 $('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;
}
async function load(){
 $('refresh').disabled=true;
 try{const r=await fetch('data/coin_transfer_matrix.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(data.schema_version!==1||!data.coins)throw Error('数据版本不兼容');bundle=data;failed=false;
 const selected=$('exchange').value;$('exchange').innerHTML='<option value="">全部现货交易所</option>'+Object.entries(names).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('exchange').value=selected;render();
 }catch(e){failed=true;if(bundle)render();else $('health').textContent='统一币种数据加载失败：'+e.message+'。请点击刷新重试。';}finally{$('refresh').disabled=false;}
}
for(const id of ['search','chain','exchange','scope'])$(id).addEventListener('input',()=>{page=0;render()});
$('prev').onclick=()=>{page--;render();window.scrollTo(0,0)};$('next').onclick=()=>{page++;render();window.scrollTo(0,0)};
$('reset').onclick=()=>{for(const id of ['search','chain','exchange','scope'])$(id).value='';page=0;render()};$('refresh').onclick=load;
load();setInterval(load,60000);
</script></html>
